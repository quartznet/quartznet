# SonarCloud analysis settings.
#
# The check that runs on pull requests is SonarCloud's automatic analysis, which reads this file.
# Note that it does NOT honour the <SonarQubeExclude> MSBuild property — that only applies to the
# MSBuild scanner, which this repository does not run.

# database/ holds SQL that ships to users, not application code, and analysing it produces only
# noise:
#
#   - The per-dialect migration scripts deliberately express the same change six ways, so the
#     duplication metric reports ~34% on any pull request that touches them.
#   - Oracle's only idiom for conditional DDL is EXECUTE IMMEDIATE against a hardcoded literal,
#     which trips the "dynamic execution of code" rule on every guarded statement.
#   - The 1.0 -> 2.0 migration converts columns with deliberately unqualified UPDATEs, which trips
#     the "UPDATE without WHERE" rule. That script has been unchanged since 2011.
#
# build/ is the Fallout build orchestrator, not shipped code. #3166 already intended to exclude it
# via <SonarQubeExclude> in build/_build.csproj, but for the reason above that never affected the
# analysis that actually runs on pull requests.
sonar.exclusions=database/**,build/**
