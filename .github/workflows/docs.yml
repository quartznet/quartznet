name: docs
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '**/docs*.yml'
      # the compiled samples the documentation shows, and the target that injects them
      - 'src/Quartz.Documentation.Samples/**'
      - 'build/**'
      # the snapshots the log event catalogue page is generated from
      - 'src/*/Verify/LogEventCatalogTest_*.verified.txt'
permissions:
  contents: read

# One deploy at a time. The last step force-pushes a whole site into quartznet.github.io, so two runs
# started by two quick pushes to main race each other and whichever finishes last wins - which is not
# necessarily the newer commit. The published site is a pure function of main, so a superseded run has
# nothing to contribute and is cancelled rather than queued.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    name: build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 'Restore: dotnet tools'
        run: dotnet tool restore

      # The site is never published from markdown that disagrees with the samples it shows.
      - name: Verify documentation snippets
        run: dotnet fallout VerifyDocsSnippets

      # Nor from a log event catalogue that disagrees with what the packages emit.
      - name: Verify the log event catalogue
        run: dotnet fallout VerifyDocsLogEvents

      # --ignore-scripts blocks the lifecycle scripts of every dependency. patch-package is ours, and
      # package.json's postinstall is the only one this repository actually wants, so it is run as its
      # own step. `npm run apply-patches`, not npx: npm run executes the copy npm ci just installed at
      # the version package-lock.json pins, where npx is free to fetch an unpinned one from the registry
      # and run its lifecycle scripts. package.json keeps postinstall as well, for contributors who run a
      # plain npm ci and should not have to know about this step at all.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Apply dependency patches
        run: npm run apply-patches

      - name: Build
        run: npm run docs:build

      # A broken link is a property of the site as a whole, and the pull request leg only ever sees the
      # pages one change touched: a heading renamed on one page 404s every fragment that pointed at it
      # from a page that change did not include. This is the whole-site run, and it is the last gate
      # before the deploy. The checker's own control - docs:check-links-test - stays on the pull request
      # leg, which is where a change to the checker is reviewed.
      - name: Check links and anchors
        run: npm run docs:check-links

      - name: Deploy
        working-directory: ./docs/.vuepress/dist
        run: |
          git init .
          git config --global user.name "Quartz.NET"
          git config --global user.email "quartznet@quartz-scheduler.net"
          git fetch https://github.com/quartznet/quartznet.github.io.git
          git checkout 9966bc53c0685311bc9199498ef2338629f6ec4d
          git checkout -b master
          git add .
          git commit -am "Deploy Documentation"
          git push --force --set-upstream https://${{secrets.DOC_DEPLOY_KEY}}:x-oauth-basic@github.com/quartznet/quartznet.github.io.git master
