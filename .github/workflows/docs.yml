name: docs
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '**/docs*.yml'
      # the compiled samples the documentation shows, and the target that injects them
      - 'src/Quartz.Documentation.Samples/**'
      - 'build/**'
permissions:
  contents: read
jobs:
  build:
    name: build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 'Restore: dotnet tools'
        run: dotnet tool restore

      # The site is never published from markdown that disagrees with the samples it shows.
      - name: Verify documentation snippets
        run: dotnet fallout VerifyDocsSnippets

      # --ignore-scripts blocks the lifecycle scripts of every dependency. patch-package is ours, and
      # package.json's postinstall is the only one this repository actually wants, so it is run as its
      # own step rather than trusting the whole tree to behave.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Apply dependency patches
        run: npx patch-package

      - name: Build
        run: npm run docs:build

      - name: Deploy
        working-directory: ./docs/.vuepress/dist
        run: |
          git init .
          git config --global user.name "Quartz.NET"
          git config --global user.email "quartznet@quartz-scheduler.net"
          git fetch https://github.com/quartznet/quartznet.github.io.git
          git checkout 9966bc53c0685311bc9199498ef2338629f6ec4d
          git checkout -b master
          git add .
          git commit -am "Deploy Documentation"
          git push --force --set-upstream https://${{secrets.DOC_DEPLOY_KEY}}:x-oauth-basic@github.com/quartznet/quartznet.github.io.git master
