# Hand-written rather than generated from build/Build.CI.GitHubActions.cs: an analysis wraps the build
# ("begin", then compile and test, then "end") and needs a JDK, and the generator emits a fixed
# checkout / setup / 'dotnet fallout <targets>' shape with no room for either.
#
# Two prerequisites live outside this repository, and until both are in place this workflow fails:
#
#   - a SONAR_TOKEN repository secret, holding a SonarCloud token with 'Execute Analysis' on
#     quartznet_quartznet
#   - Automatic Analysis switched off in the project's Administration -> Analysis Method. SonarCloud
#     rejects a CI analysis while it is on, and Automatic Analysis cannot import coverage reports at
#     all, which is the reason this workflow exists.
name: sonar

on:
  push:
    branches:
      - main
      - '3.x'
    paths:
      - '**/*'
      - '!docs/**/*'
      - '!package.json'
      - '!package-lock.json'
      - '!readme.md'
  pull_request:
    branches:
      - main
      - '3.x'
    paths:
      - '**/*'
      - '!docs/**/*'
      - '!package.json'
      - '!package-lock.json'
      - '!readme.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    # A pull request from a fork cannot read SONAR_TOKEN, so the scanner would have nothing to
    # authenticate with. Neither can one Dependabot opened: those runs draw on Dependabot's own
    # secret store, which is separate from the repository's and holds no SONAR_TOKEN — and a
    # dependency bump changes no code Sonar has anything to say about. Both kinds of pull request
    # keep every other check.
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The scanner attributes new code through git blame, which a shallow clone cannot answer.
          fetch-depth: 0
      - name: 'Setup: JDK'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Install: SonarScanner for .NET'
        run: dotnet tool install --global dotnet-sonarscanner
      - name: 'Sonar: begin'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Without this the scanner reports an empty sonar.token as a format error, which reads
          # like a typo rather than a missing secret.
          [ -n "$SONAR_TOKEN" ] || { echo "::error::SONAR_TOKEN is not set — see the header of .github/workflows/sonar.yml"; exit 1; }
          # sonar.coverage.exclusions, not sonar.exclusions: the scanner imports C# coverage only
          # (sonar.cs.opencover.reportsPaths below), so JavaScript build tooling arrives as new code
          # carrying no coverage data at all and fails the new-code coverage condition by itself. It
          # stays in analysis, where the bug and security rules still apply to it; what it is excused
          # from is a coverage figure this workflow is not configured to produce. Its own control is
          # `npm run docs:check-links-test`.
          #
          # The dashboard's Razor components used to be excused here too, because nothing could
          # render one. #3363 added the bUnit harness — src/Quartz.Tests.AspNetCore/Dashboard/
          # Components — and every component the dashboard routes to is now rendered by a test, so
          # coverlet reports the generated component classes through their #line directives back to
          # the .razor file and the exclusion is gone. Nothing about the dashboard is excused from
          # coverage any more; if a component test cannot be written, that is a seam to add rather
          # than a line to put back here.
          #
          # src/Quartz.Trimming.Canary is excused from coverage for the opposite reason to the usual
          # one: it is not code a test covers, it is a test. `dotnet fallout PublishTrimmed` publishes
          # it fully trimmed and then runs it, and a non-zero exit fails that leg — which is the only
          # way to prove what it proves, since the failure it guards against (#3341, step 6) produced
          # no compile-time warning of its own. No coverage instrumentation sees any of it: the run
          # happens out of process, in a different leg, over a trimmed self-contained publish. It
          # stays in analysis like everything else here.
          #
          # database/ is excused from copy-paste detection and from two PL/SQL rules, and from
          # nothing else. Its bug and security rules still apply; these three are the ones that
          # have nothing true to say about it.
          #
          #   Duplication. Six dialects saying the same thing is the design, not a defect: every
          #   migration ships one directly-runnable file per database, three SQL Server variants
          #   declare the same tables, and a migration has to declare exactly what the fresh-install
          #   script declares -- MigrationScriptTest fails when the two drift apart. The detector
          #   measures the schema's shape rather than anything a reviewer can act on, which is why
          #   the vendored baselines above are already excused for the same reason.
          #
          #   plsql:S1523, "make sure this dynamic execution of code is safe". Every instance in the
          #   repository is a generated existence guard under database/migrations: Oracle has no
          #   CREATE TABLE IF NOT EXISTS and no ALTER TABLE ... IF NOT EXISTS, so the only way to
          #   write a re-runnable migration there is to read the catalog and EXECUTE IMMEDIATE. The
          #   statement is a literal constant emitted by build/Build.DatabaseMigrations.cs with
          #   nothing interpolated into it, so there is no injection channel to review.
          #
          #   plsql:DeleteOrUpdateWithoutWhereCheck, "the WHERE clause may be missing". Every
          #   instance is a whole-table statement that means it: the teardown preamble of
          #   tables_oracle.sql, which drops each of those tables a few lines later, and the three
          #   backfills in the 1.x -> 2.x upgrade that populate a column just added to every row.
          dotnet-sonarscanner begin \
            /k:"quartznet_quartznet" \
            /o:"quartznet" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="artifacts/coverage/**/coverage.opencover.xml" \
            /d:sonar.exclusions="src/Quartz.Tests.Integration/SchemaBaselines/**" \
            /d:sonar.cpd.exclusions="src/Quartz.Tests.Integration/SchemaBaselines/**,database/**" \
            /d:sonar.coverage.exclusions="docs/.vuepress/**,src/Quartz.Trimming.Canary/**" \
            /d:sonar.issue.ignore.multicriteria="generatedOracleGuards,wholeTableByDesign" \
            /d:sonar.issue.ignore.multicriteria.generatedOracleGuards.ruleKey="plsql:S1523" \
            /d:sonar.issue.ignore.multicriteria.generatedOracleGuards.resourceKey="database/migrations/**/*.sql" \
            /d:sonar.issue.ignore.multicriteria.wholeTableByDesign.ruleKey="plsql:DeleteOrUpdateWithoutWhereCheck" \
            /d:sonar.issue.ignore.multicriteria.wholeTableByDesign.resourceKey="database/**/*.sql"
      # Has to sit between begin and end: the scanner analyses through MSBuild, so only projects
      # actually built while it is active are measured.
      - name: 'Run: Compile, UnitTest'
        run: dotnet fallout Compile UnitTest --coverage
      - name: 'Sonar: end'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
