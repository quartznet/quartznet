name: publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: write

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 20
    environment: nuget
    steps:
      - uses: actions/checkout@v7
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: Compile, UnitTest, Pack, Publish, DraftRelease'
        run: dotnet fallout Compile UnitTest Pack Publish DraftRelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Publish: artifacts'
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: artifacts
