name: pr-tests-unit-net11

on:
  pull_request:
    branches:
      - main
      - '3.x'
    paths:
      - 'src/**/*'
      - 'build/**/*'
      - 'database/**/*'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.config'
      - 'testconfig.json'
      - '.config/dotnet-tools.json'
      - '.github/workflows/pr-tests-unit-net11.yml'

env:
  UnitTestRuntime: 11

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: 'Setup: unit test time zone'
        run: echo "UnitTestTimeZone=America/Chicago" >> "$GITHUB_ENV"
      - name: 'Setup: .NET 11 SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-quality: preview
          dotnet-version: 11.0.x
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: Compile, Pack, Net11ConsumerSmoke'
        run: dotnet fallout Compile Pack Net11ConsumerSmoke
      - name: 'Run: UnitTest'
        run: dotnet fallout UnitTest --skip
        if: ${{ !cancelled() }}
      - name: 'Publish: test results'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: test-results-${{ runner.os }}
          path: artifacts/test-results
          retention-days: 5
        if: ${{ failure() }}
