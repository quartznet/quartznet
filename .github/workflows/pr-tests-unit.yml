name: pr-tests-unit

on:
  pull_request:
    branches:
      - main
      - '3.x'
    paths:
      - '**/*'
      - '!docs/**/*'
      - '!apidoc/**/*'
      - '!package.json'
      - '!package-lock.json'
      - '!README.md'
      - '!CONTRIBUTING.md'
      - '!CODE_OF_CONDUCT.md'
      - '!database/README.md'
      - '!.github/SECURITY.md'
      - '!.github/pull_request_template.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  windows-latest:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: VerifyMigrations, VerifySchema, Compile, UnitTest, BenchmarkSmoke, WolverineSmoke, ExamplesSmoke, PublishTrimmed, PublishAot'
        run: dotnet fallout VerifyMigrations VerifySchema Compile UnitTest BenchmarkSmoke WolverineSmoke ExamplesSmoke PublishTrimmed PublishAot
      - name: 'Publish: test results'
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: test-results-${{ runner.os }}
          path: artifacts/test-results
          retention-days: 5
        if: ${{ failure() }}
