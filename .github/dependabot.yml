# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # The actions the workflows use. Nothing watched them before, so a pinned major goes stale in silence
  # until GitHub deprecates the runtime behind it and the leg starts failing - which is how the two
  # hand-written docs workflows sat three majors behind on actions/checkout while the generated ones
  # moved on.
  #
  # Eleven of the fifteen workflows are generated from build/Build.CI.GitHubActions.cs and carry the
  # action versions Fallout writes, so a bump Dependabot proposes for one of those is not a bump to
  # keep: the next 'fallout --generate-configuration' run puts the old version straight back. Move
  # Fallout instead, and let the generator write the new versions. The four hand-written workflows -
  # docs.yml, docs-pr.yml, sonar.yml and issue-triage.yml - are the ones this ecosystem is for.
  #
  # One group, because an action bump is a one-line change and fifteen separate pull requests for the
  # same major would be fifteen reviews of the same decision.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Fallout's 11.x packages were published by the pre-community maintainership and the line is
      # abandoned; releases continue from 10.4.0, which is semver-lower but newer. Without this,
      # every run would propose "upgrading" back to the dead 11.0.18.
      - dependency-name: "Fallout.*"
        versions: ["11.*"]
      # Verify 33 adopted the Open Source Maintenance Fee. The core Verify package bundles a SponsorCheck
      # MSBuild task that fails the build with SC021 unless a Verify_* sponsorship or exemption property
      # is set, and its nuspec licence became a file EULA (OsmfEula.txt) instead of the MIT expression.
      # 32.0.1 is the last version with neither. The repository takes no dependency that needs a licence
      # declaration; if 32.x ever stops being enough, replace the snapshot library with an in-repo helper
      # rather than raise this.
      - dependency-name: "Verify*"
        versions: [">= 33.0.0"]
      # The dependency floors, which are the versions a consumer inherits from a shipped nuspec rather
      # than versions this repository runs on. Directory.Packages.props, "The floors a consumer
      # inherits", says the whole of why: 4.0.0 floored six framework extensions at whatever
      # Dependabot had most recently proposed, and an application pinning one of them a patch lower
      # could not restore at all (#3717). A weekly minor or patch here is exactly the change that
      # caused that, so it is not offered; a major still is, because a major is a decision.
      #
      # Raise one of these by hand, for a security advisory, to the version that fixed it.
      # PackageDependencyTest fails a Microsoft.* floor that is not x.0.0 either way.
      #
      # An ignore entry stops a direct proposal only. When an allowed update needs a newer patch of a
      # floored id, Dependabot raises that id as a required dependency whatever the entry says:
      # Microsoft.Extensions.Diagnostics.Testing 10.10.0 needs Microsoft.Extensions.Logging 10.0.12, and
      # Microsoft.AspNetCore.Mvc.Testing 10.0.12 needs Microsoft.Extensions.Hosting 10.0.12 (#3838,
      # #3847, #3852). Directory.Build.targets closes that door instead: a project that ships nothing
      # does not pin transitively, so the test project meets its test package's requirement itself and
      # no row moves (#3855).
      #
      # The Microsoft.* floors are ignored by range. A version entry is read as a Dependabot requirement,
      # not as a NuGet wildcard, and "10.x" matched no version above 10.0.0, so the 10.0.12 patch of
      # Microsoft.Extensions.Logging.Abstractions came through as a direct proposal (#3851). The range
      # holds every 10.x above the floor. 11.0.0 is still proposed; accepting it means moving the range
      # up a major.
      - dependency-name: "Microsoft.Extensions.Configuration.Binder"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.DependencyInjection"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.Diagnostics.HealthChecks"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.Hosting"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.Hosting.Abstractions"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.Http"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.Logging"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.Logging.Abstractions"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.Logging.Console"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Microsoft.Extensions.Options.ConfigurationExtensions"
        versions: [">= 10.0.1, < 11.0.0"]
      - dependency-name: "Newtonsoft.Json"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "OpenTelemetry.Extensions.Hosting"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "StackExchange.Redis"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "TimeZoneConverter"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    # Dependencies are matched against groups in the order they are declared here,
    # and each dependency ends up in the first group it matches.
    groups:
      # The Fallout build orchestrator.
      build-tooling:
        patterns:
          - "Fallout.*"
      # Test frameworks, assertion libraries, mocks, containers and benchmarking.
      testing:
        patterns:
          - "NUnit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Mvc.Testing"
          - "Microsoft.Extensions.Diagnostics.Testing"
          - "Microsoft.Extensions.TimeProvider.Testing"
          - "FakeItEasy"
          - "AwesomeAssertions*"
          - "Verify*"
          - "Testcontainers*"
          - "MELT"
          - "GitHubActionsTestLogger"
          - "BenchmarkDotNet*"
      # Compile-time only tooling: analyzers and source generators.
      analyzers:
        patterns:
          - "*.Analyzers"
          - "Meziantou.Analyzer"
          - "Microsoft.CodeAnalysis*"
      # ADO.NET providers and other data store clients used by the job stores.
      database-providers:
        patterns:
          - "Microsoft.Data.SqlClient"
          - "Microsoft.Data.SQLite*"
          - "System.Data.SQLite*"
          - "MySqlConnector"
          - "Npgsql*"
          - "Oracle.ManagedDataAccess*"
          - "FirebirdSql.Data.FirebirdClient"
          - "StackExchange.Redis"
      logging:
        patterns:
          - "Serilog*"
          - "NLog*"
          - "Microsoft.Extensions.Logging*"
      telemetry:
        patterns:
          - "OpenTelemetry*"
          - "OpenTracing"
          - "System.Diagnostics.DiagnosticSource"
      # Aspire's AppHost SDK and hosting packages, used by the Aspire example. They ship as one
      # version on Aspire's own release cadence rather than the .NET runtime's, so they move
      # together. Declared ahead of `microsoft` because Aspire also publishes under
      # `Microsoft.Extensions.*` names, and the first matching group here is the one that wins.
      aspire:
        patterns:
          - "Aspire.*"
      # Wolverine, used by the Wolverine example. The core package and its extensions ship as one
      # version on JasperFx's own cadence, and a mismatched pair fails at startup rather than at
      # restore, so they move together.
      wolverine:
        patterns:
          - "WolverineFx*"
      # Everything else shipped out of dotnet/runtime and dotnet/aspnetcore.
      microsoft:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "System.*"
      # Web/API packages used by the samples and the server host.
      web:
        patterns:
          - "AspNetCore.HealthChecks*"
          - "NSwag*"
          - "Swashbuckle*"
